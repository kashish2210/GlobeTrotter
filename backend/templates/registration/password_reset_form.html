{% extends "base.html" %}

{% block title %}Reset Password - GlobeTrotter{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h1>Forgot Password</h1>
        <p>Enter your email address below, and we'll email instructions for setting a new one.</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_email">Email address</label>
            <input type="email" name="email" class="form-control" autocomplete="email" maxlength="254" required id="id_email">
        </div>
        
        <button type="submit" class="btn-primary">Send Reset Link</button>
    </form>

    <div class="auth-links">
        <p>Remember your password? <a href="{% url 'login' %}">Log in</a></p>
    </div>
</div>
{% endblock %}
