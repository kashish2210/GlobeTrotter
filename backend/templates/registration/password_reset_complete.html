{% extends "base.html" %}

{% block title %}Password Changed - GlobeTrotter{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h1>Password reset complete</h1>
        <p>Your password has been set. You may go ahead and log in now.</p>
    </div>
    
    <div class="auth-links">
        <a href="{% url 'login' %}" class="btn-primary" style="display: inline-block; box-sizing: border-box; text-decoration: none;">Log In</a>
    </div>
</div>
{% endblock %}
